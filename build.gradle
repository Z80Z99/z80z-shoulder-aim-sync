plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // MixinGradle 必须在 ForgeGradle 之后应用
    id 'org.spongepowered.mixin' version '0.7.38'
}
version = '1.0.0-r10'
group = 'cn.blockforge.generated.shoulderaimsync'
base { archivesName = 'z80z-shoulder-aim-sync' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { z80z_shoulder_aim_sync { source sourceSets.main } }
        }
    }
}
repositories {
    mavenCentral()
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'z80z_shoulder_aim_sync.refmap.json'
    config 'z80z_shoulder_aim_sync.mixins.json'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'z80z_shoulder_aim_sync', mod_name: 'Z80Z 越肩视角与枪械瞄准', mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')
